<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="description" content="拾月 — 一款治愈系等距视错觉解谜小游戏。小兔团团提着灯，把碎成六瓣的月光送回天上。">
<title>拾月 · Gather the Moon</title>
<style>
:root{--paper:#f4efe6;--paper-ink:#3b3836;--seal:#b8452f;--ink:#4a474c;--ink-soft:rgba(74,71,76,.55);
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC","SimSun",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);font-family:var(--serif);color:var(--paper-ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{touch-action:none;cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:1px solid currentColor;outline-offset:3px}

#chapter,#hud,#hint,#endline{position:absolute;color:var(--ink);opacity:0;transition:opacity .9s ease;pointer-events:none}
#chapter{left:max(22px,env(safe-area-inset-left));top:max(22px,env(safe-area-inset-top));font-size:14px;font-weight:600;letter-spacing:.42em}
#chapter.on{opacity:.78}
#hud{right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:10px}
#hud.on{opacity:1;pointer-events:auto}
#hud button{width:36px;height:36px;border-radius:50%;border:1px solid var(--ink-soft);font-size:14px;font-weight:600;line-height:34px;text-align:center;opacity:.8;transition:opacity .2s}
#hud button:hover{opacity:1}
#bmu.off{text-decoration:line-through;opacity:.45}
#hint{left:50%;bottom:max(34px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:15px;font-weight:600;letter-spacing:.24em;white-space:nowrap}
#hint.on{opacity:.82}
#endline{left:0;right:0;bottom:max(46px,env(safe-area-inset-bottom));text-align:center}
#endline.on{opacity:1}
#endtext{font-size:clamp(18px,2.6vw,24px);font-weight:400;letter-spacing:.3em;padding-left:.3em}
#endgo{display:block;margin-top:22px;font-size:12px;font-weight:700;letter-spacing:.5em;opacity:0;transition:opacity .9s}
#endgo.on{opacity:.6;animation:breath 2.6s ease-in-out infinite}

.screen{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 0s linear 1.1s;padding:72px 32px}
.screen.on{opacity:1;visibility:visible;transition:opacity .8s ease}
#veil{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .7s ease}
#veil.on{opacity:1;pointer-events:auto}

/* 标题 */
#title{cursor:pointer}
.t-row{display:flex;align-items:flex-start;gap:28px}
.t-name{writing-mode:vertical-rl;font-size:clamp(72px,15vmin,132px);font-weight:300;letter-spacing:.18em;line-height:1}
.t-side{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:10px}
.t-moon{width:34px;height:34px;border-radius:50%;box-shadow:inset -9px 5px 0 0 #c9a45c}
.t-seal{writing-mode:vertical-rl;background:var(--seal);color:#f8ece0;font-size:13px;font-weight:700;letter-spacing:.12em;padding:7px 4px 5px;border-radius:2px}
.t-pro{margin-top:56px;font-size:15px;font-weight:500;line-height:2.3;letter-spacing:.2em;text-align:center;opacity:.78}
.t-go{margin-top:60px;font-size:13px;font-weight:700;letter-spacing:.5em;padding-left:.5em;opacity:.6;animation:breath 2.6s ease-in-out infinite}
.t-en{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font-size:10px;font-weight:700;letter-spacing:.6em;padding-left:.6em;opacity:.38;font-family:Georgia,"Times New Roman",serif}

/* 章节页 */
#card .c-no{font-size:13px;font-weight:700;letter-spacing:.6em;padding-left:.6em;opacity:.55}
#card .c-name{margin:34px 0 40px;writing-mode:vertical-rl;font-size:clamp(56px,11vmin,96px);font-weight:300;letter-spacing:.2em;line-height:1}
#card .c-rule{width:1px;height:42px;background:var(--seal);opacity:.7;margin-bottom:34px}
#card .c-poem{font-size:16px;font-weight:500;letter-spacing:.28em;padding-left:.28em;opacity:.8;text-align:center;max-width:22em;line-height:2}

/* 选章 */
#levels{z-index:5}
#levels h2{font-size:13px;font-weight:700;letter-spacing:.6em;padding-left:.6em;opacity:.55;margin-bottom:56px}
#lvlist{display:flex;gap:clamp(14px,4vw,40px);flex-direction:row-reverse}
.lv{display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 6px;transition:opacity .2s}
.lv-no{width:30px;height:30px;line-height:30px;font-size:13px;font-weight:700;text-align:center;border:1px solid rgba(59,56,54,.4);border-radius:2px}
.lv.done .lv-no{background:var(--seal);border-color:var(--seal);color:#f8ece0}
.lv-name{writing-mode:vertical-rl;font-size:clamp(22px,4.2vmin,30px);font-weight:400;letter-spacing:.3em}
.lv.locked{opacity:.26;cursor:default}
.lv:not(.locked):hover .lv-name{color:var(--seal)}
#lvclose{margin-top:64px;font-size:13px;font-weight:700;letter-spacing:.5em;padding:10px 18px 10px calc(18px + .5em);opacity:.6}

/* 终章 */
#finale{background:#121b36;color:#f1ead8}
.f-moon{width:clamp(96px,20vmin,150px);aspect-ratio:1;border-radius:50%;background:#fff5d4}
.f-lines{margin-top:56px;text-align:center}
.f-lines p{font-size:clamp(16px,2.4vw,20px);font-weight:400;letter-spacing:.3em;padding-left:.3em;line-height:2.5;opacity:0}
#finale.on .f-lines p{animation:rise 1.6s ease forwards}
#finale.on .f-lines p:nth-child(1){animation-delay:.8s}
#finale.on .f-lines p:nth-child(2){animation-delay:2.8s}
#finale.on .f-lines p:nth-child(3){animation-delay:4.8s}
.f-btns{margin-top:52px;display:flex;gap:28px;opacity:0}
#finale.on .f-btns{animation:rise 1.4s ease 6.8s forwards}
.f-btns button{font-size:13px;font-weight:700;letter-spacing:.4em;padding:11px 18px 11px calc(18px + .4em);border:1px solid rgba(241,234,216,.4);border-radius:2px}
.f-cred{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));font-size:11px;font-weight:600;letter-spacing:.3em;opacity:.4}

#nogl{z-index:9;font-size:15px;letter-spacing:.2em;line-height:2.2;text-align:center}
@keyframes breath{0%,100%{opacity:.28}50%{opacity:.72}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:.92;transform:none}}
@media (prefers-reduced-motion:reduce){.t-go,#endgo.on{animation:none}}
@media (max-width:520px){#hint{font-size:13px;letter-spacing:.14em}.t-pro{font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <div id="chapter"></div>
  <div id="hud">
    <button id="blv" aria-label="选择章节" title="章节">章</button>
    <button id="bre" aria-label="重来本章" title="重来 (R)">复</button>
    <button id="bmu" aria-label="声音开关" title="声音 (M)">音</button>
  </div>
  <div id="hint" role="status"></div>
  <div id="endline"><p id="endtext"></p><span id="endgo">轻触继续</span></div>

  <section id="card" class="screen">
    <div class="c-no" id="cno"></div>
    <h2 class="c-name" id="cname"></h2>
    <div class="c-rule"></div>
    <p class="c-poem" id="cpoem"></p>
  </section>

  <section id="title" class="screen on">
    <div class="t-row">
      <h1 class="t-name">拾月</h1>
      <div class="t-side"><div class="t-moon"></div><div class="t-seal">团团</div></div>
    </div>
    <p class="t-pro">月亮碎了，六瓣月光<br>落进六座沉睡的庭院。<br>小兔团团提着灯，出发了。</p>
    <p class="t-go" id="tgo">轻触开始</p>
    <p class="t-en">GATHER THE MOON</p>
  </section>

  <section id="finale" class="screen">
    <div class="f-moon"></div>
    <div class="f-lines">
      <p>月亮圆了。</p>
      <p>团团回头，来时的每一盏灯都亮着。</p>
      <p>谢谢你，陪它走完这一程。</p>
    </div>
    <div class="f-btns"><button id="again">再走一遍</button><button id="pick">选章</button></div>
    <p class="f-cred">拾月 · 全部画面与声音由代码生成</p>
  </section>

  <section id="levels" class="screen">
    <h2>章节</h2>
    <div id="lvlist"></div>
    <button id="lvclose">返回</button>
  </section>

  <div id="veil"></div>
  <section id="nogl" class="screen"><p>这台设备的浏览器没有开启 WebGL，<br>换一个现代浏览器再来看月亮吧。</p></section>
</div>
<script src="js/levels.js"></script>
<script src="js/logic.js"></script>
<script src="js/gfx.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
